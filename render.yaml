# Render Blueprint for Northline — REVIEW-ONLY first deployment.
# NAMES ONLY: this file never contains a secret value. Secrets are typed into the Render dashboard by the operator
# (`sync: false` = Render asks for the value at creation and never reads it from git).
#
# Review-only means: NORTHLINE_READONLY=true, and NO OpenAI / Gemini / image-provider / webhook variables at all.
# The app can only view the existing Supabase-backed data; every mutation (create, generate, QA, approve, edit, upload) is refused.
services:
  - type: web
    name: northline
    runtime: node
    plan: starter            # always-on instance (the free tier sleeps). Pick the region closest to your Supabase project in the dashboard.
    branch: claude/gracious-knuth-kwtmz5
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false        # deploy deliberately; switch on once you are happy
    envVars:
      - key: NODE_VERSION
        value: "22"
      # --- non-secret mode switches ---
      - key: NORTHLINE_STORE
        value: supabase
      - key: NORTHLINE_READONLY
        value: "true"
      # Budget governor ON so the Command Center shows real limits/usage (read-only: it only READS them). Durable jobs and autonomous
      # generation stay OFF; no provider credentials are configured on this deployment.
      - key: NORTHLINE_GOVERNOR
        value: "on"
      - key: NORTHLINE_DURABLE_JOBS
        value: "off"
      - key: NORTHLINE_AUTONOMOUS_GENERATION
        value: "off"
      # --- secrets: you enter these in the Render dashboard (never committed) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NORTHLINE_ADMIN_PASSWORD
        sync: false
      # generated by Render itself (random, never typed or committed)
      - key: NORTHLINE_SESSION_SECRET
        generateValue: true
